name: Deploy to GitHub Pages

# Builds the site and publishes it to the gh-pages branch,
# which GitHub Pages serves at:
#   https://puspagotame1588-create.github.io/Youtube-analyzer/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base path + absolute URL derive from the repo name, so renaming
      # the repository (Settings → General → Rename) fixes the site URL
      # automatically on the next push — no code changes needed.
      - run: npm run build
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
