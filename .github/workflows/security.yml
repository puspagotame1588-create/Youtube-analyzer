name: security

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    # Blocks the build if a secret is newly committed.
    name: Gitleaks (block committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Gitleaks can scan every commit
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  verify:
    name: typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

  dependency-audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Production dependencies only; informational so a deferred, tracked
      # advisory (e.g. the planned Next.js 15.5.x upgrade) does not block merges.
      - run: npm audit --omit=dev --audit-level=high || true
